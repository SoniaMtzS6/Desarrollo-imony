# Configuración de la aplicación
spring.application.name=settlements-api
server.port=8080

# Configuración de Pomelo API
pomelo.api.base-url=https://api.pomelo.la
pomelo.api.client-id=${POMELO_CLIENT_ID:your-client-id}
pomelo.api.client-secret=${POMELO_CLIENT_SECRET:your-client-secret}
pomelo.api.username=${POMELO_USERNAME:your-username}
pomelo.api.password=${POMELO_PASSWORD:your-password}

# Configuración de logging
logging.level.com.fisinter.settlements=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# Configuración de CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuración de timeout para llamadas HTTP
spring.mvc.async.request-timeout=30000 
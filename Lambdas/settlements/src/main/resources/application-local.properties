# Configuración local para desarrollo
# Este archivo se usa cuando se ejecuta la aplicación localmente

# Configuración de base de datos local (si es necesario)
# spring.datasource.url=jdbc:mysql://localhost:3306/fisinter
# spring.datasource.username=root
# spring.datasource.password=

# Configuración de logging más detallada para desarrollo
logging.level.com.fisinter.settlements=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuración de CORS más permisiva para desarrollo local
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Configuración de timeout más corta para desarrollo
spring.mvc.async.request-timeout=15000 